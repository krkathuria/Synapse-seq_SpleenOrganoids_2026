# Generic checkpoint-figure environment. For exact fresh clustering on macOS ARM64,
# follow ENVIRONMENT.md and conda-numerics-osx-arm64.txt instead.
name: synapse-seq
channels:
  - conda-forge
dependencies:
  - python=3.11.8
  - pip
  - pip:
      - scanpy==1.9.4
      - anndata==0.9.2
      - numpy==1.24.4
      - scipy==1.11.2
      - pandas==2.1.0
      - scikit-learn==1.1.3
      - statsmodels==0.14.0
      - umap-learn==0.5.3
      - pynndescent==0.5.10
      - igraph==0.10.6
      - harmonypy==0.0.9
      - leidenalg==0.10.1
      - matplotlib==3.7.3
      - seaborn==0.12.2
      - regex
      - statannotations==0.7.2
      - openpyxl==3.1.2
      - numba==0.57.1
      - llvmlite==0.40.1
      - threadpoolctl
      - ipython==8.15.0
      - nbformat==5.9.2
      - jupyterlab==4.0.5
